name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      universal:
        description: "Build a universal (Apple Silicon + Intel) app"
        type: boolean
        default: true
      release:
        description: "Publish the DMG as a GitHub release"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      DOWNLY_TOOLS_DIR: ${{ github.workspace }}/.tools-cache
      UNIVERSAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.universal) && '1' || '' }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version
          sw_vers

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.arch }}-${{ env.UNIVERSAL }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.arch }}-${{ env.UNIVERSAL }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            cargo-${{ runner.arch }}-${{ env.UNIVERSAL }}-

      - name: Restore engine cache
        uses: actions/cache@v4
        with:
          path: .tools-cache
          key: tools-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            tools-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build app
        run: |
          if [ -n "$UNIVERSAL" ]; then TARGET=universal-apple-darwin; else TARGET=aarch64-apple-darwin; fi
          npx tauri build --ci --target "$TARGET" --bundles app
          APP="src-tauri/target/$TARGET/release/bundle/macos/Downly.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/"*
          /usr/libexec/PlistBuddy -c "Print CFBundleURLTypes" "$APP/Contents/Info.plist" || true
          rm -rf dist-mac && mkdir -p dist-mac/dmg
          cp -R "$APP" dist-mac/dmg/
          ln -s /Applications dist-mac/dmg/Applications
          hdiutil create -volname Downly -srcfolder dist-mac/dmg -ov -format UDZO dist-mac/Downly.dmg
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          du -sh "$APP" dist-mac/Downly.dmg

      - name: Build self-test
        run: cargo build --release --bin downly-selftest --manifest-path src-tauri/Cargo.toml

      - name: Self-test
        timeout-minutes: 20
        run: |
          set -o pipefail
          src-tauri/target/release/downly-selftest --downloads 2>&1 | tee selftest.log

      - name: Launch smoke test
        timeout-minutes: 3
        run: |
          EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Contents/Info.plist")
          "$APP_PATH/Contents/MacOS/$EXE" > launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then
            echo "Downly is running"
            kill $PID
          else
            echo "Downly exited early"
            cat launch.log
            exit 1
          fi
          cat launch.log

      - name: UI screenshots
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node scripts/screenshots.mjs snapshots
          ls -la snapshots

      - name: Commit UI screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshots]')
        run: |
          shopt -s nullglob
          files=(snapshots/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "no snapshots"; exit 0; fi
          rm -f docs/screenshots/*.png
          mkdir -p docs/screenshots
          cp snapshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git commit -m "Update UI screenshots [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Downly-dmg
          path: dist-mac/Downly.dmg
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            snapshots/
            selftest.log
            launch.log
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist-mac/Downly.dmg --title "Downly $VERSION" --notes-file docs/RELEASE_NOTES.md --target "$GITHUB_SHA"
